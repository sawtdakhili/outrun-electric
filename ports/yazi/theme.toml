# Outrun Electric Theme for Yazi
# Based on Doom Emacs outrun-electric theme
# Place this in ~/.config/yazi/theme.toml
#
# Written against Yazi's current schema (26.x). Older Yazi releases used
# different table/key names for several of these — [tab] instead of [tabs],
# [status].mode_* instead of a top-level [mode], mgr.hovered/preview_hovered
# instead of [indicator], [select]/[completion] instead of [pick]/[cmp],
# and different [help] keys. Silently-ignored unknown keys are how a chunk of
# this file used to do nothing at all — if you're porting to a much older or
# newer Yazi, diff against `yazi-config/preset/theme-dark.toml` upstream first.

[mgr]
cwd = { fg = "#f2f3f7", bg = "#0c0a20" }

# Find
find_keyword  = { fg = "#ffd400", italic = true }
find_position = { fg = "#ff2afc", bg = "reset", italic = true }

# Marker
marker_selected = { fg = "#a7da1e", bg = "#a7da1e" }
marker_copied   = { fg = "#ffd400", bg = "#ffd400" }
marker_cut      = { fg = "#e61f44", bg = "#e61f44" }
marker_marked   = { fg = "#42c6ff", bg = "#42c6ff" }

# Count (bulk copy/cut/select badges)
count_copied   = { fg = "#0c0a20", bg = "#ffd400" }
count_cut      = { fg = "#0c0a20", bg = "#e61f44" }
count_selected = { fg = "#0c0a20", bg = "#a7da1e" }

# Border
border_symbol = "│"
border_style  = { fg = "#7984D1" }

# Highlighting
syntect_theme = "base16-ocean.dark"

[tabs]
active   = { fg = "#0c0a20", bg = "#ff2afc", bold = true }
inactive = { fg = "#7984D1", bg = "#131033" }

# Magenta cursor as a mark, not a fill — matching the other two ports rather
# than inventing a third convention: Ghostty's cursor-color is a thin caret
# (its one filled highlight, selection-background, uses the softer base5
# #BA45A3 instead, and only while actively selecting text); Claude Code's
# promptBorder is a border line, and that port's own README says outright
# that its "background" key isn't a fill, it's a border/title accent. Both
# treat magenta as always-visible but small. A full-row magenta block was a
# third, unprecedented pattern — bold+coloured text reads just as clearly
# (magenta has the highest presence in the palette) without needing area.
[indicator]
current = { fg = "#ff2afc", bold = true }
parent  = { fg = "#f2f3f7", bg = "#1f1147" }
preview = { underline = true }

[mode]
normal_main = { fg = "#0c0a20", bg = "#ff2afc", bold = true }
normal_alt  = { fg = "#ff2afc", bg = "#1f1147" }

select_main = { fg = "#0c0a20", bg = "#a7da1e", bold = true }
select_alt  = { fg = "#a7da1e", bg = "#1f1147" }

unset_main = { fg = "#0c0a20", bg = "#e61f44", bold = true }
unset_alt  = { fg = "#e61f44", bg = "#1f1147" }

[status]
# Permissions (renamed from permissions_t/r/w/x/s; no more sticky-bit key)
perm_sep   = { fg = "#546A90" }
perm_type  = { fg = "#a7da1e" }
perm_read  = { fg = "#ffd400" }
perm_write = { fg = "#e61f44" }
perm_exec  = { fg = "#df85ff" }

# Progress
progress_label  = { fg = "#df85ff", bold = true }
progress_normal = { fg = "#df85ff", bg = "#131033" }
progress_error  = { fg = "#e61f44", bg = "#131033" }

[which]
mask            = { bg = "#090819" }
cand            = { fg = "#42c6ff" }
rest            = { fg = "#546A90" }
desc            = { fg = "#df85ff" }
separator       = "  "
separator_style = { fg = "#2d2844" }

[confirm]
border = { fg = "#A875FF" }
title  = { fg = "#df85ff" }

[spot]
border   = { fg = "#A875FF" }
title    = { fg = "#df85ff" }
tbl_col  = { fg = "#42c6ff" }
tbl_cell = { fg = "#ffd400", reversed = true }

[notify]
title_info  = { fg = "#a7da1e" }
title_warn  = { fg = "#ffd400" }
title_error = { fg = "#e61f44" }

# Renamed from [select]
[pick]
border   = { fg = "#A875FF" }
active   = { fg = "#ff2afc", bold = true }
inactive = { fg = "#7984D1" }

[input]
border   = { fg = "#A875FF" }
title    = { fg = "#df85ff" }
value    = { fg = "#ffd400" }
selected = { reversed = true }

# Renamed from [completion]
[cmp]
border   = { fg = "#A875FF" }
active   = { reversed = true }
inactive = { fg = "#7984D1" }

[tasks]
border  = { fg = "#A875FF" }
title   = { fg = "#df85ff" }
hovered = { fg = "#ff2afc", bold = true }

# Keys changed from on/exec/desc/footer to border/chord/action.
[help]
border  = { fg = "#A875FF" }
chord   = { fg = "#42c6ff" }
action  = {}
hovered = { bg = "#2d2844", bold = true }

[filetype]
# Deliberately short. The previous version of this file gave almost every
# extension its own hue — which is precisely the mistake PALETTE.md warns
# against ("a port that spreads all twelve hues evenly across roles reads as
# noisy and muted, because nothing anchors it"). Directories and ordinary
# files stay uncoloured on purpose, so the magenta cursor in [indicator]
# above is the only thing that reliably draws the eye. Everything below is
# a genuine exception worth flagging, not a lookup table.
rules = [
	# Directories - bold, not coloured; shape (the folder icon) carries the
	# distinction, not hue
	{ url = "*/", bold = true },

	# Runnable - the one thing worth a hard warning colour, and genuinely rare
	{ url = "*", is = "exec", fg = "#e61f44", bold = true },
	{ url = "*.exe", fg = "#e61f44", bold = true },
	{ url = "*.app", fg = "#e61f44", bold = true },
	{ url = "*/bin/*", fg = "#e61f44", bold = true },

	# Archives - inert cargo, not code; muted rather than alarming
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#546A90" },

	# Media - one shared accent for leaf content (images/video/audio),
	# instead of the original's three near-duplicate rule blocks
	{ mime = "image/*", fg = "#df85ff" },
	{ mime = "video/*", fg = "#df85ff" },
	{ mime = "audio/*", fg = "#df85ff" },

	# Docs worth noticing at a glance
	{ url = "*.md", fg = "#a7da1e" },
	{ url = "README*", fg = "#a7da1e" },

	# Hidden files - present but de-emphasised, not another bright hue
	{ url = ".*", fg = "#546A90" },

	# Fallback - plain foreground; most files are not exceptions
	{ url = "*", fg = "#f2f3f7" },
]
